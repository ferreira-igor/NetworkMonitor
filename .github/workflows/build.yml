name: Build Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'NetworkMonitor.ino'
      - '.github/workflows/build.yml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'NetworkMonitor.ino'
      - '.github/workflows/build.yml'

  workflow_dispatch:

env:
  ARDUINO_CLI_VERSION: 1.5.1
  ESP32_BOARD_PACKAGE_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ESP32_CORE_VERSION: 3.3.11
  BOARD_FQBN: esp32:esp32:d32

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure ESP32 Core
        run: |
          arduino-cli config add board_manager.additional_urls "$ESP32_BOARD_PACKAGE_URL"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$ESP32_CORE_VERSION"

      - name: Install Libraries
        run: |
          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "AsyncTelegram2@2.3.4"
          arduino-cli lib install "ArduinoJson@6.21.6"

      - name: Compile Firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "$BOARD_FQBN" \
            --export-binaries \
            --build-path "./build" \
            .

      - name: 🔍 Localizar e mover binários
        run: |
          echo "📂 Conteúdo da pasta build antes de mover:"
          find build -type f
          
          # Move todos os .bin para a raiz da pasta build
          find build -name "*.bin" -exec mv -v {} build/ \;
          
          echo ""
          echo "📂 Conteúdo da pasta build depois de mover:"
          ls -lh build/
          
          echo ""
          echo "📂 Verificando se o .bin está na raiz:"
          ls -lh build/*.bin

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: build/*.bin
          if-no-files-found: error
