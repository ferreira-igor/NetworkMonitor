name: Build Firmware

on:
  push:
    paths:
      - '**/*.ino'

  workflow_dispatch:

env:
  ARDUINO_CLI_VERSION: 1.5.1
  ESP32_CORE_VERSION: 3.3.11
  BOARD_FQBN: esp32:esp32:d32

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure ESP32 Core
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index

      - name: Install ESP32 Core
        run: |
          arduino-cli core install \
            esp32:esp32@${ESP32_CORE_VERSION}

      - name: Install Libraries
        run: |
          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "AsyncTelegram2@2.3.4"
          arduino-cli lib install "ArduinoJson@6.21.6"
          
      - name: Detect Sketch
        run: |
          INO_FILE=$(find . -maxdepth 1 -type f -name "*.ino" -print -quit)

          if [ -z "$INO_FILE" ]; then
            echo "ERROR: No .ino file found in the project root."
            exit 1
          fi

          echo "Sketch found: $INO_FILE"

      - name: Compile Firmware
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn "$BOARD_FQBN" \
            --output-dir build \
            --export-binaries \
            .

      - name: Verify Firmware
        run: |
          echo "Generated files:"
          ls -lh build/

          BIN_FILE=$(find build -maxdepth 1 -type f -name "*.bin" -print -quit)

          if [ -z "$BIN_FILE" ]; then
            echo "ERROR: .bin firmware was not generated."
            exit 1
          fi

          echo ""
          echo "Firmware generated successfully:"
          echo "$BIN_FILE"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.bin
