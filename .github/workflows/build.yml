name: Build Arduino Firmware

on:
  push:
    paths:
      - '**/*.ino'
      - 'libraries.txt'
      - '.github/workflows/build.yml'

  workflow_dispatch:

env:
  ARDUINO_CLI_VERSION: 1.3.1
  ESP32_CORE_VERSION: 3.3.11
  BOARD_FQBN: esp32:esp32:lolin_d32

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Show toolchain versions
        run: |
          echo "Arduino CLI:"
          arduino-cli version

          echo "ESP32 Core:"
          arduino-cli core list

      - name: Configure ESP32 board manager
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Update board index
        run: |
          arduino-cli core update-index

      - name: Install ESP32 Core
        run: |
          arduino-cli core install \
            esp32:esp32@${ESP32_CORE_VERSION}

      - name: Install libraries
        if: hashFiles('libraries.txt') != ''
        run: |
          arduino-cli lib install --file libraries.txt

      - name: Detect project
        run: |
          INO_FILE=$(find . -maxdepth 1 -name "*.ino" -print -quit)

          if [ -z "$INO_FILE" ]; then
            echo "ERROR: No .ino file found in project root."
            exit 1
          fi

          PROJECT_NAME=$(basename "$INO_FILE" .ino)

          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_NAME"
          echo "Source: $INO_FILE"

      - name: Create build directory
        run: |
          mkdir -p build

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn "$BOARD_FQBN" \
            --output-dir build \
            --export-binaries \
            "$PROJECT_NAME"

      - name: Show firmware information
        run: |
          echo "Generated firmware:"
          ls -lh build/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-firmware
          path: build/
