name: Build Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'NetworkMonitor.ino'
      - '.github/workflows/build.yml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'NetworkMonitor.ino'
      - '.github/workflows/build.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile Arduino Sketches
        uses: arduino/compile-sketches@v1.1.3
        with:
          fqbn: esp32:esp32:d32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.11
          libraries: |
            - name: WiFiManager
              version: 2.0.17
            - name: AsyncTelegram2
              version: 2.3.4
            - name: ArduinoJson
              version: 6.21.6
          sketch-paths: |
            - .
          enable-deltas-report: true
          enable-warnings-report: true
          cli-compile-flags: --export-binaries --output-dir=./build

      - name: 🔍 Localizar arquivos gerados
        run: |
          echo "📂 Conteúdo do diretório atual:"
          ls -la
          echo ""
          echo "📂 Procurando por .bin em toda parte:"
          find . -name "*.bin" -type f 2>/dev/null || echo "Nenhum .bin encontrado"
          echo ""
          echo "📂 Procurando por pastas de build:"
          find . -type d -name "build" -o -name "*build*" 2>/dev/null | head -20
          echo ""
          echo "📂 Estrutura completa (limitado a 50 itens):"
          find . -type f 2>/dev/null | head -50

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: build/**/*.bin
          if-no-files-found: error
