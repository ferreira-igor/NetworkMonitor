name: Build Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'NetworkMonitor.ino'
      - '.github/workflows/build.yml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'NetworkMonitor.ino'
      - '.github/workflows/build.yml'

  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  ARDUINO_CLI_VERSION: 1.5.1
  ESP32_BOARD_PACKAGE_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ESP32_CORE_VERSION: 3.3.11
  BOARD_FQBN: esp32:esp32:d32

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure ESP32 Core
        run: |
          arduino-cli config add board_manager.additional_urls "$ESP32_BOARD_PACKAGE_URL"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$ESP32_CORE_VERSION"

      - name: Install Libraries
        run: |
          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "AsyncTelegram2@2.3.4"
          arduino-cli lib install "ArduinoJson@6.21.6"

      - name: Compile Firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "$BOARD_FQBN" \
            --export-binaries \
            --build-path "./build" \
            .

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: build/**/*.bin
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Firmware v1.0.${{ github.run_number }}"
          body: |
            ## 📦 Firmware for LOLIN D32 (ESP32)
            
            **Compiled on:** ${{ github.event.head_commit.timestamp }}
            **Commit hash:** `${{ github.sha }}`
            **ESP32 Core Version:** ${{ env.ESP32_CORE_VERSION }}
            
            ### 📂 Included files:
            - `NetworkMonitor.ino.bin` - Main firmware
            - `NetworkMonitor.ino.bootloader.bin` - Bootloader
            - `NetworkMonitor.ino.merged.bin` - Complete firmware (bootloader + app)
            - `NetworkMonitor.ino.partitions.bin` - Partition table
            - `boot_app0.bin` - Bootloader app
            
            ### ⚠️ How to flash:
            Use **esptool.py** or **ESP32 Flash Download Tool** to flash `NetworkMonitor.ino.bin` at address `0x10000`.
          files: build/**/*.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
