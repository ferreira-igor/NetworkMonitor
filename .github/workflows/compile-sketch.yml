name: Compile Sketch

on:
  push:
    branches:
      - main
    paths:
      - '*.ino'
      - '.github/workflows/compile-sketch.yml'
  
  pull_request:
    branches:
      - main
    paths:
      - '*.ino'
      - '.github/workflows/compile-sketch.yml'

  workflow_dispatch:

env:
  BOARD_FQBN: esp32:esp32:d32:PartitionScheme=no_ota,EraseFlash=all

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.5.1

      - name: Install ESP32 Core
        run: |
          arduino-cli config add board_manager.additional_urls "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@3.3.11"

      - name: Install Libraries
        run: |
          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "AsyncTelegram2@2.3.4"
          arduino-cli lib install "ArduinoJson@6.21.6"

      - name: Compile Firmware
        run: |
          mkdir -p build
          arduino-cli compile --fqbn "$BOARD_FQBN" --export-binaries --build-path "./build" .
          
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: firmware-${{ github.sha }}
          path: build/*.bin
          if-no-files-found: error

      - name: GH Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: firmware
          name: "Latest Firmware"
          body: |
            **FQBN:** ${{ env.BOARD_FQBN }}
            **Compiled on:** ${{ github.event.head_commit.timestamp }}
            **Commit hash:** `${{ github.sha }}`
          files: build/*.bin
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
