<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetworkMonitor - Firmware Installer</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 32px 24px;
            text-align: center;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(24px, 7vw, 32px);
            line-height: 1.2;
        }

        p {
            margin: 0 auto 28px;
            max-width: 380px;
            font-size: clamp(14px, 4vw, 16px);
            line-height: 1.5;
            color: #666;
        }

        esp-web-install-button {
            display: inline-block;
        }

        @media (max-width: 360px) {
            body {
                padding: 16px;
            }

            .container {
                padding: 24px 16px;
                border-radius: 12px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
                margin-bottom: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>NetworkMonitor</h1>
        <p>Install the latest firmware on your ESP32 device.</p>
        <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
    </main>
</body>

</html>
